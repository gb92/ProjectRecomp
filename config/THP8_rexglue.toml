# Tony Hawk's Project 8 (Xbox 360) - ReXGlue Project Manifest

[project]
name = "thp8"
sdk_version = "0.10.0"

[entrypoint]
file_path = "../private/unpatched-game-full/default.xex"
out_directory_path = "../generated"

# Conservative: all registers in context (same as XenonRecomp config)
skip_lr = true
skip_msr = true
ctr_as_local = false
xer_as_local = false
cr_as_local = false
reserved_as_local = false
non_argument_as_local = false
non_volatile_as_local = false
generate_exception_handlers = false

[entrypoint.analysis]
max_jump_extension = 65536
data_region_threshold = 16

