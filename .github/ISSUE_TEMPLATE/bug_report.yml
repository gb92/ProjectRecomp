name: Bug report
description: Report incorrect runtime or gameplay behavior
title: "[Bug]: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        Do not attach or link to ISOs, XEX files, extracted assets, saves, or other copyrighted game data.
  - type: checkboxes
    id: prerequisites
    attributes:
      label: Prerequisites
      options:
        - label: I tested the latest `main` revision.
          required: true
        - label: I searched for an existing report.
          required: true
        - label: I am using my own legally acquired, unmodified Xbox 360 game files.
          required: true
        - label: I am using the supported base executable revision `0.0.0.1` without a title update.
          required: true
        - label: This report contains no game files or download links.
          required: true
  - type: dropdown
    id: platform
    attributes:
      label: Platform
      options:
        - Windows 11 x86-64
        - Windows 10 x86-64
        - Linux x86-64
        - Unsupported platform
    validations:
      required: true
  - type: input
    id: revision
    attributes:
      label: ProjectRecomp revision
      description: Provide the Git commit hash or release version.
      placeholder: 12e6f9e
    validations:
      required: true
  - type: input
    id: hardware
    attributes:
      label: CPU, GPU, and driver
      placeholder: Ryzen 7 5800X3D, RTX 3080, NVIDIA 555.99
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: Problem
      description: Describe what happened and when it began.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction steps
      placeholder: |
        1. Launch the game
        2. Load a save
        3. Enter...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: diagnostics
    attributes:
      label: Diagnostics
      description: Paste relevant logs, settings, or measurements after removing sensitive paths. Do not upload game files.
      render: shell
  - type: textarea
    id: additional
    attributes:
      label: Additional context
      description: Screenshots or short recordings are welcome if they contain no copyrighted file dumps.
